# ──────────────────────────────────────────────
# Configuração de treinamento (PA1) — por parte
# Edite este arquivo para mudar qualquer parâmetro.
# Uso: uv run pa1 0 | uv run pa1 1 | uv run pa1 2 | ...
# ──────────────────────────────────────────────

# ── Comum ───────────────────────────────────────
seed: 42
output_dir: outputs

# ── Parte 0 — Teste unitário sintético ────────────────────────────
parte0:
  synthetic: true
  data_dir: null
  n_samples: 100
  batch_size: 8
  num_workers: 2
  in_channels: 1          # escala de cinza (sintético)
  out_channels: 2         # 2 = binário (fundo/objeto)
  epochs: 20
  lr: 1.0e-3
  checkpoint: null
  eval_only: false

# ── Parte 1 — Baseline com dados reais (DSB2018) ─────────────────
parte1:
  synthetic: false
  data_dir: pa1/data/stage1_train
  n_samples: 100
  batch_size: 8
  num_workers: 2
  in_channels: 3         # RGB (DSB2018)
  out_channels: 2        # binário (fundo/objeto)
  epochs: 20
  lr: 1.0e-3
  checkpoint: null
  eval_only: false

# ── Parte 2 — Trilha A: Fronteiras + Watershed ───────────────────
parte2:
  synthetic: false
  data_dir: pa1/data/stage1_train
  n_samples: 100
  batch_size: 8
  num_workers: 2
  in_channels: 3         # RGB (DSB2018)
  out_channels: 3        # 3 = Trilha A (fundo/interior/fronteira)
  epochs: 30
  lr: 1.0e-3
  checkpoint: null
  eval_only: false
