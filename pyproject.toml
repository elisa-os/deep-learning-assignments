[project]
name = "deep-learning-assignments"
version = "0.1.0"
description = "PA1 — Segmentação de Instâncias (Aprendizado Profundo, FGV)"
readme = "README.md"
authors = [
    { name = "Bruno Ferreira", email = "brunoferreira17k@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.0",
    "torch>=2.14.0",
]

[project.scripts]
pa1 = "pa1.main:main"

[tool.uv.sources]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "pa1"
